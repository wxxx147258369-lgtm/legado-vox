      - name: Static safety check
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Remove unreliable CI mirror
        shell: bash
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Full compile validation
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: v5-1-hybrid-stable-${{ github.run_number }}

      - name: Commit only after successful compile
        shell: bash
        run: |
          git checkout -- settings.gradle || true

          if git diff --quiet; then
            echo "Already upgraded and validated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

