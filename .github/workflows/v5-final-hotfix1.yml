name: V5 Final Hotfix 1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v5-final-hotfix1.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: v5-final-hotfix1
  cancel-in-progress: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Hotfix 1 and role casting rules
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v5_hotfix1.py
          python -m py_compile /tmp/v5_hotfix1.py
          python /tmp/v5_hotfix1.py

      - name: Static diff safety
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Remove unreliable CI mirror
        shell: bash
        run: |
          cp settings.gradle settings.gradle.hotfix1.bak
          sed -i '/maven\.aliyun\.com/d' settings.gradle

      - name: Full regression gate
        shell: bash
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: v5-final-hotfix1-${{ github.run_number }}
        run: |
          ./gradlew testAppDebugUnitTest verifyConfigArchitecture lintAppDebug assembleAppDebug --continue --no-daemon --no-configuration-cache

      - name: Restore build config
        if: always()
        shell: bash
        run: |
          if [ -f settings.gradle.hotfix1.bak ]; then
            mv settings.gradle.hotfix1.bak settings.gradle
          fi

      - name: Commit hotfix after all gates pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/src/main/java/io/legado/app/service/TTSReadAloudService.kt             app/src/main/java/io/legado/app/domain/model/readaloud/HumanizedSpeechTuning.kt             app/src/main/java/io/legado/app/domain/model/readaloud/NovelVoiceCastingRules.kt             app/src/test/java/io/legado/app/domain/model/readaloud/NovelVoiceCastingRulesTest.kt

          if git diff --cached --quiet; then
            echo "Hotfix already present."
          else
            git commit -m "fix(tts): stable novel casting with male narrator and Mandarin voices"
            git push origin HEAD:main
          fi

      - name: Build final APK and freeze again
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FINAL_SHA=$(git rev-parse HEAD)
          gh workflow enable auto-release.yml
          gh workflow run auto-release.yml --ref main

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list               --workflow auto-release.yml               --branch main               --limit 10               --json databaseId,headSha,event               --jq ".[] | select(.headSha == \"$FINAL_SHA\" and .event == \"workflow_dispatch\") | .databaseId" |
              head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not locate Hotfix 1 APK build run."
            exit 1
          fi

          echo "Hotfix 1 APK run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          gh workflow disable auto-release.yml || true
          gh workflow disable v5-final-hotfix1.yml || true
