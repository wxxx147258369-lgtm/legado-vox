name: 一键构建-V5拟人有声剧-纯规则-1.3倍

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-vox-v5-humanized.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取源码
        uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 写入 V5 自动演员表与拟人语气
        shell: bash
        run: |
          echo '' | base64 -d > app/src/main/java/io/legado/app/domain/usecase/BuildSpeechPlanUseCase.kt
          echo '' | base64 -d > app/src/main/java/io/legado/app/domain/model/readaloud/SystemTtsVoiceConfig.kt
          echo '' | base64 -d > app/src/main/java/io/legado/app/help/readaloud/segment/SpeechEmotionDetector.kt

      - name: 加强纯规则分片并使旧缓存失效
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/io/legado/app/help/readaloud/segment/RuleBasedSpeechSegmenter.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'const val VERSION = "rule-segmenter-v2-emotion"',
              'const val VERSION = "rule-segmenter-v5-humanized"'
          )
          old = '''return if (inner.length >= 6 || inner.any(sentencePunctuation::contains)) {
            SpeechRoleType.Character
        } else {
            SpeechRoleType.Narrator
        }'''
          new = '''return if (
            inner.isNotBlank() &&
            (
                text[openIndex] in setOf('“', '‘', '「', '『') ||
                inner.length >= 6 ||
                inner.any(sentencePunctuation::contains)
            )
        ) {
            SpeechRoleType.Character
        } else {
            SpeechRoleType.Narrator
        }'''
          if old not in s:
              raise SystemExit("未找到短对白规则，停止构建，避免静默漏补丁")
          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

      - name: 强制纯规则多人朗读
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/io/legado/app/service/BaseReadAloudService.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "val useMultiSpeaker = ReadConfig.useMultiSpeaker",
              "val useMultiSpeaker = true"
          )
          old = '''analysisMode = if (useMultiSpeaker) {
                    SpeechAnalysisMode.fromStorage(ReadConfig.speechAnalysisMode)
                } else {
                    SpeechAnalysisMode.Rule
                },'''
          new = '''analysisMode = SpeechAnalysisMode.Rule,'''.strip()
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

      - name: 接入动态语速音高与拟人停顿
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/io/legado/app/service/TTSReadAloudService.kt")
          s = p.read_text(encoding="utf-8")

          old = '''    private fun applyPreset(voice: ReadAloudVoice) {
        val config = runCatching {
            GSON.fromJson(voice.traitsJson, SystemTtsVoiceConfig::class.java)
        }.getOrNull() ?: SystemTtsVoiceConfig()
        val globalRate = if (ReadConfig.ttsFollowSys) {
            1f
        } else {
            (ReadConfig.ttsSpeechRate + 5) / 10f
        }
        textToSpeech?.apply {
            setSpeechRate(config.speechRate ?: globalRate)
            setPitch(config.pitch ?: 1f)
        }
    }
'''
          new = '''    private fun applyPreset(voice: ReadAloudVoice) {
        val config = runCatching {
            GSON.fromJson(voice.traitsJson, SystemTtsVoiceConfig::class.java)
        }.getOrNull() ?: SystemTtsVoiceConfig()

        val configuredRate = (ReadConfig.ttsSpeechRate + 5) / 10f
        val globalRate = if (ReadConfig.ttsFollowSys || ReadConfig.ttsSpeechRate == 5) {
            1.3f
        } else {
            configuredRate
        }
        val finalRate = ((config.speechRate ?: globalRate) *
            (config.rateMultiplier ?: 1f)).coerceIn(0.65f, 2.5f)
        val finalPitch = ((config.pitch ?: 1f) *
            (config.pitchMultiplier ?: 1f)).coerceIn(0.65f, 1.35f)

        textToSpeech?.apply {
            setSpeechRate(finalRate)
            setPitch(finalPitch)
        }
    }

    private fun dynamicCueIntervalMs(): Long {
        val base = ReadConfig.ttsParagraphInterval.toLong().coerceAtLeast(80L)
        val cue = playbackQueue.cues.getOrNull(nowSpeak) ?: return base
        val text = cue.text.trim()
        val value = when {
            text.endsWith("……") || text.endsWith("...") -> maxOf(base, 280L)
            cue.roleType.name.equals("Thought", ignoreCase = true) -> maxOf(base, 170L)
            cue.emotion.equals("sad", ignoreCase = true) -> maxOf(base, 190L)
            cue.emotion.equals("whispering", ignoreCase = true) -> maxOf(base, 170L)
            cue.emotion.equals("angry", ignoreCase = true) -> minOf(base, 70L)
            text.endsWith("？") || text.endsWith("?") -> maxOf(base, 125L)
            text.endsWith("！") || text.endsWith("!") -> maxOf(70L, base - 20L)
            else -> base
        }
        return value.coerceIn(50L, 400L)
    }

    private fun shouldSkipTtsNoise(text: String): Boolean {
        val value = text.trim()
        return value.matches(
            Regex("^(?:本章未完.*|.*最新网址.*|.*请收藏本站.*|.*手机用户请浏览.*|.*关注公众号.*|.*章节报错.*|.*加入书签.*)$")
        )
    }
'''
          if old not in s:
              raise SystemExit("未找到 applyPreset，停止构建，避免静默漏补丁")
          s = s.replace(old, new)
          s = s.replace(
              "val interval = ReadConfig.ttsParagraphInterval.toLong()",
              "val interval = dynamicCueIntervalMs()"
          )
          s = s.replace(
              "needParagraphInterval = ReadConfig.ttsParagraphInterval > 0",
              "needParagraphInterval = hasSpeechPlaybackQueue || ReadConfig.ttsParagraphInterval > 0"
          )
          s = s.replace(
              "if (text.matches(AppPattern.notReadAloudRegex)) {",
              "if (text.matches(AppPattern.notReadAloudRegex) || shouldSkipTtsNoise(text)) {"
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: 默认 1.3 倍与稳定缓存参数
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/io/legado/app/domain/model/settings/ReadAloudSettings.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace("val ttsFollowSys: Boolean = true,", "val ttsFollowSys: Boolean = false,")
          s = s.replace("val ttsSpeechRate: Int = 5,", "val ttsSpeechRate: Int = 8,")
          s = s.replace('val speechAnalysisMode: String = "rule",', 'val speechAnalysisMode: String = "rule",')
          s = s.replace("val useMultiSpeaker: Boolean = true,", "val useMultiSpeaker: Boolean = true,")
          s = s.replace("val audioPreDownloadNum: Int = 10,", "val audioPreDownloadNum: Int = 6,")
          s = s.replace("val ttsPreSynthesisConcurrency: Int = 3,", "val ttsPreSynthesisConcurrency: Int = 2,")
          p.write_text(s, encoding="utf-8")

          p = Path("app/src/main/java/io/legado/app/data/repository/ReadAloudSettingsRepository.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace("compatDsValue(ReadAloudKeys.TtsFollowSys, true)", "compatDsValue(ReadAloudKeys.TtsFollowSys, false)")
          s = s.replace("compatDsValue(ReadAloudKeys.TtsSpeechRate, 5)", "compatDsValue(ReadAloudKeys.TtsSpeechRate, 8)")
          s = s.replace("compatDsValue(ReadAloudKeys.UseMultiSpeaker, true)", "compatDsValue(ReadAloudKeys.UseMultiSpeaker, true)")
          s = s.replace("compatDsValue(ReadAloudKeys.AudioPreDownloadNum, 10)", "compatDsValue(ReadAloudKeys.AudioPreDownloadNum, 6)")
          s = s.replace("compatDsValue(ReadAloudKeys.PreSynthesisConcurrency, 3)", "compatDsValue(ReadAloudKeys.PreSynthesisConcurrency, 2)")
          p.write_text(s, encoding="utf-8")
          PY

      - name: 独立安装名称
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'manifestPlaceholders["app_name"] = "@string/app_name"',
              'manifestPlaceholders["app_name"] = "阅读 Vox V5拟人有声剧 1.3x"'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: 清理 CI 不稳定镜像源
        shell: bash
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: 构建 APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: v5-humanized-rule-13x-${{ github.run_number }}

      - name: 整理 APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/app/debug -maxdepth 1 -name "*.apk" | head -n 1)
          cp "$APK" "out/阅读Vox-V5拟人有声剧-纯规则-1.3倍.apk"
          ls -lh out

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 阅读Vox-V5拟人有声剧-纯规则-1.3倍
          path: out/阅读Vox-V5拟人有声剧-纯规则-1.3倍.apk
          if-no-files-found: error
