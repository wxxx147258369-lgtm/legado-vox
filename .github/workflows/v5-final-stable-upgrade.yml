name: V5 Final Stable Upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v5-final-stable-upgrade.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: v5-final-stable-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Quiesce legacy build chains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          for workflow in             build-vox-v5-humanized.yml             v5-1-hybrid-stable-upgrade.yml             v5-stable-formal-upgrade.yml             apply-edge-upgrade-direct.yml             fix-edge-workflow.yml; do
            gh workflow disable "$workflow" >/dev/null 2>&1 || true
          done

          for workflow in auto-release.yml verify.yml; do
            gh run list --workflow "$workflow" --limit 20               --json databaseId,status               --jq '.[] | select(
                .status == "queued" or
                .status == "in_progress" or
                .status == "waiting" or
                .status == "requested" or
                .status == "pending"
              ) | .databaseId' |
            while read -r run_id; do
              [ -n "$run_id" ] && gh run cancel "$run_id" >/dev/null 2>&1 || true
            done
          done

          gh workflow disable auto-release.yml >/dev/null 2>&1 || true
          set -e

      - name: Apply final stable engine
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v5_final_patch.py
          python3 -m py_compile /tmp/v5_final_patch.py
          python3 /tmp/v5_final_patch.py

      - name: Static diff safety
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Remove unreliable CI mirror
        shell: bash
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Final regression gate
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew             testAppDebugUnitTest             verifyConfigArchitecture             lintAppDebug             assembleAppDebug             --continue             --no-daemon             --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: v5-final-stable-${{ github.run_number }}

      - name: Commit only after all gates pass
        shell: bash
        run: |
          git checkout -- settings.gradle || true

          if git diff --quiet; then
            echo "Final stable source already present."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             app/src/main/java/io/legado/app/domain/model/readaloud/HumanizedSpeechTuning.kt             app/src/main/java/io/legado/app/domain/model/readaloud/SystemTtsVoiceConfig.kt             app/src/main/java/io/legado/app/domain/model/readaloud/ReadAloudPlaybackQueue.kt             app/src/main/java/io/legado/app/help/readaloud/segment/RuleBasedSpeechSegmenter.kt             app/src/main/java/io/legado/app/help/readaloud/segment/AiSpeechAtomizer.kt             app/src/main/java/io/legado/app/domain/usecase/PrepareChapterSpeechPlanUseCase.kt             app/src/main/java/io/legado/app/domain/usecase/RefineSpeechWithAiUseCase.kt             app/src/main/java/io/legado/app/service/TTSReadAloudService.kt             app/src/main/java/io/legado/app/domain/model/settings/ReadAloudSettings.kt             app/src/main/java/io/legado/app/data/repository/ReadAloudSettingsRepository.kt             app/src/test/java/io/legado/app/help/readaloud/segment/V5FinalSpeechRegressionTest.kt             app/src/test/java/io/legado/app/domain/model/readaloud/V5FinalPlaybackQueueRegressionTest.kt

          git commit -m "feat(tts): V5 final stable hybrid narration engine"
          git push origin HEAD:main

      - name: Build final APK, verify it, then freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          FINAL_SHA=$(git rev-parse HEAD)

          gh workflow enable auto-release.yml
          gh workflow run auto-release.yml --ref main

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list               --workflow auto-release.yml               --branch main               --limit 10               --json databaseId,headSha,event               --jq ".[] | select(.headSha == \"$FINAL_SHA\" and .event == \"workflow_dispatch\") | .databaseId" |
              head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not locate the final APK build run."
            exit 1
          fi

          echo "Final APK run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

          gh workflow disable auto-release.yml || true
          gh workflow disable build-vox-v5-humanized.yml || true
          gh workflow disable v5-1-hybrid-stable-upgrade.yml || true
          gh workflow disable v5-stable-formal-upgrade.yml || true
          gh workflow disable apply-edge-upgrade-direct.yml || true
          gh workflow disable fix-edge-workflow.yml || true
          gh workflow disable v5-final-stable-upgrade.yml || true

          {
            echo "## V5 Final Stable frozen"
            echo ""
            echo "- Source commit: $FINAL_SHA"
            echo "- Final APK workflow run: $RUN_ID"
            echo "- Legacy upgrade workflows: disabled"
            echo "- Auto Build: disabled after successful final build"
          } >> "$GITHUB_STEP_SUMMARY"
