name: 一键构建-全小说自动多人配音版

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-auto-voice-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取源码
        uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 写入全小说自动多人配音逻辑
        shell: bash
        run: |
          echo '' | base64 -d > app/src/main/java/io/legado/app/domain/usecase/BuildSpeechPlanUseCase.kt

      - name: 改成独立安装名称
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s = s.replace('manifestPlaceholders["app_name"] = "@string/app_name"', 'manifestPlaceholders["app_name"] = "阅读 Vox 自动配音版"')
          p.write_text(s, encoding="utf-8")
          PY

      - name: 清理 CI 不稳定镜像源
        shell: bash
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: 构建可直接安装 APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: auto-voice-${{ github.run_number }}

      - name: 整理 APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/app/debug -maxdepth 1 -name "*.apk" | head -n 1)
          cp "$APK" "out/阅读Vox-全小说自动多人配音版.apk"
          ls -lh out

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 阅读Vox-全小说自动多人配音版
          path: out/阅读Vox-全小说自动多人配音版.apk
          if-no-files-found: error
